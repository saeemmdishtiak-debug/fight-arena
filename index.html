<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fight Arena</title><link rel="stylesheet" href="style.css"></head><body>
<div id="home"><h1>FIGHT ARENA</h1><button id="create">CREATE GAME</button><div><input id="room" placeholder="ROOM CODE"><button id="join">JOIN GAME</button></div></div>
<div id="wait" class="hide"><h2>WAITING FOR OPPONENT</h2><input id="link" readonly><button id="copy">COPY LINK</button></div>
<div id="game" class="hide"><header><div>P1 <div class="bar"><i id="h1"></i></div><small id="s1">0</small></div><b id="time">60</b><div>P2 <div class="bar"><i id="h2"></i></div><small id="s2">0</small></div></header><main><div id="msg">FIGHT!</div><div id="p1" class="fighter one">🥊</div><div id="p2" class="fighter two">🥊</div></main><footer><button data-k="a">←</button><button data-k="d">→</button><button data-k="w">↑</button><button data-k="f">👊</button><button data-k="g">⚡</button><button data-k="s">🛡️</button></footer></div>
<div id="result" class="hide"><h1 id="win"></h1><button onclick="location.href='/'">EXIT</button></div><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
